<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>テスト勉強プランナー</title>
<link rel="manifest" href="planner-manifest.json">
<link rel="apple-touch-icon" href="icon-study-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#5b6cff">
<style>
:root{--bg:#f5f6fa;--card:#fff;--text:#1d2230;--sub:#6b7285;--line:#e3e6ee;--accent:#5b6cff;--accent2:#eef0ff;--ok:#1f9d6b;--okbg:#e5f6ee;--warn:#c77700;--warnbg:#fff4e0;--bad:#d93a45;--shadow:0 1px 3px rgba(20,30,60,.07)}
@media (prefers-color-scheme:dark){:root{--bg:#12141b;--card:#1b1e28;--text:#e8eaf2;--sub:#9aa1b5;--line:#2c303d;--accent:#8a95ff;--accent2:#262b47;--ok:#43c38f;--okbg:#17302a;--warn:#f0a73a;--warnbg:#33290f;--bad:#f06a73;--shadow:none}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Hiragino Sans","Yu Gothic UI",sans-serif;font-size:15px;line-height:1.5;padding-bottom:40px}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.hwrap{max-width:860px;margin:0 auto;padding:10px 16px 0}
.top{display:flex;align-items:center;gap:10px}
h1{font-size:18px;margin:0;flex:1}
.sync{font-size:12px;color:var(--sub);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--sub)}
.dot.on{background:var(--ok)}.dot.off{background:var(--warn)}
nav{display:flex;gap:2px;overflow-x:auto;margin-top:8px}
nav button{border:0;background:none;color:var(--sub);padding:8px 12px;font-size:14px;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
nav button.act{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
main{max-width:860px;margin:0 auto;padding:12px 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow)}
.card h2{font-size:15px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.card h2 .r{margin-left:auto;font-weight:400;font-size:13px;color:var(--sub)}
.muted{color:var(--sub);font-size:13px}
.btn{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:8px;padding:6px 12px;font-size:14px;cursor:pointer}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.sm{padding:3px 9px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
input,select{font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 8px;min-width:0}
input[type=number]{width:80px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.chip{flex:0 0 auto;border-radius:10px;padding:8px 12px;background:var(--card);border:1px solid var(--line);min-width:108px}
.chip .s{font-size:12px;color:var(--sub)}
.chip .d{font-size:22px;font-weight:700;line-height:1.2}
.chip .d small{font-size:12px;font-weight:400;color:var(--sub)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.item{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item input[type=checkbox]{width:20px;height:20px;margin:2px 0 0;flex:0 0 auto;accent-color:var(--accent)}
.item .b{flex:1;min-width:0}
.item .t{word-break:break-word}
.item.done .t{text-decoration:line-through;color:var(--sub)}
.item .m{font-size:12px;color:var(--sub)}
.item .min{font-size:12px;color:var(--sub);white-space:nowrap}
.tag{display:inline-block;font-size:11px;padding:0 6px;border-radius:6px;background:var(--accent2);color:var(--accent);margin-right:4px;vertical-align:1px}
.tag.w{background:var(--warnbg);color:var(--warn)}
.tag.over{background:var(--warnbg);color:var(--warn)}
.sd{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:0}
a.ob{color:var(--accent);text-decoration:none;font-size:12px;white-space:nowrap}
.alert{border-radius:10px;padding:10px 12px;margin-bottom:12px;font-size:14px}
.alert.w{background:var(--warnbg);color:var(--warn)}
.alert.ok{background:var(--okbg);color:var(--ok)}
.cmd{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--line)}
.cmd:first-of-type{border-top:0}
.cmd code{flex:1;background:var(--bg);padding:4px 8px;border-radius:6px;font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}
.row label{font-size:13px;color:var(--sub)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:640px){.grid2{grid-template-columns:1fr}}
.timer{text-align:center}
.timer .clock{font-size:44px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:1px}
.day{border-top:1px solid var(--line);padding:10px 0}
.day:first-child{border-top:0}
.dh{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.dh b{min-width:78px}
.dh .bar{flex:1}
.dl{font-size:13px;padding-left:4px}
.dl div{padding:1px 0}
.subj{border-top:1px solid var(--line);padding:10px 0}
.subj:first-of-type{border-top:0}
.sh{display:flex;align-items:center;gap:8px;cursor:pointer}
.sh .n{font-weight:600;min-width:70px}
.sh .bar{flex:1}
.sh .p{font-size:13px;color:var(--sub);white-space:nowrap}
.exrow{display:grid;grid-template-columns:1fr 150px auto;gap:6px;margin:6px 0}
.tasks{margin:0 0 8px 8px;font-size:13px}
.empty{text-align:center;color:var(--sub);padding:18px 8px}
.ring{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.ring .big{font-size:20px;font-weight:700}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#222;color:#fff;padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;transition:.2s;pointer-events:none;z-index:9}
.toast.on{opacity:.95}
.hbar{display:flex;align-items:center;gap:8px;font-size:13px;margin:4px 0}
.hbar span:first-child{min-width:70px}
.hbar .bar{flex:1;height:10px}
details summary{cursor:pointer;color:var(--sub);font-size:13px}
</style>
</head>
<body>
<header><div class="hwrap">
  <div class="top"><h1>📚 テスト勉強プランナー</h1><div class="sync" id="syncSt"></div></div>
  <nav id="nav">
    <button data-tab="today">今日</button><button data-tab="plan">計画</button><button data-tab="prog">進度</button><button data-tab="tests">テスト</button><button data-tab="set">設定</button>
  </nav>
</div></header>
<main id="main"></main>
<div class="toast" id="toast"></div>
<script>
'use strict';
// ===== 保存 =====
const LS='test-planner-v1', LS_IDX='test-planner-vault-v1', LS_SYNC='test-planner-sync-v1', LS_TAB='test-planner-tab';
const PLAN_DIR=['outputs','勉強計画'], DASH='今日のTODO.md';
const lsGet=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch{return d}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};
function defSettings(){return {weekday:120,holiday:240,noteMin:20,reviewMin:10,finalMin:60,reserve:1,review:[1,3,7],pomo:25,brk:5,includeOld:false}}
let S=Object.assign({tests:[],tasks:[],done:{},logs:[],dayCap:{}},lsGet(LS,{}));
S.settings=Object.assign(defSettings(),S.settings||{});
let IDX=Object.assign({vault:null,notes:[],sources:[],cited:[],outputs:[],at:0},lsGet(LS_IDX,{}));
let SYNC=lsGet(LS_SYNC,{});
S.deleted=S.deleted||{};S.ups=S.ups||{};S.logs.forEach(l=>l.id||(l.id=Math.random().toString(36).slice(2,9)));
// 変更検知：保存のたびに前回との差分を見て、変わった項目に更新時刻(up)を付ける（端末間の統合に使う）
let SNAP=null;
const snapOf=o=>{const {up,...r}=o;return JSON.stringify(r)};
function takeSnap(){SNAP={settings:JSON.stringify(S.settings),dayCap:JSON.stringify(S.dayCap)};S.tests.forEach(t=>SNAP['T'+t.id]=snapOf(t));S.tasks.forEach(t=>SNAP['K'+t.id]=snapOf(t))}
function stamp(){
  const now=Date.now();
  if(SNAP){
    const cur={};S.tests.forEach(t=>cur['T'+t.id]=t);S.tasks.forEach(t=>cur['K'+t.id]=t);
    for(const [k,o] of Object.entries(cur))if(SNAP[k]!==snapOf(o))o.up=now;
    for(const k of Object.keys(SNAP))if((k[0]==='T'||k[0]==='K')&&!cur[k])S.deleted[k.slice(1)]=now;
    if(SNAP.settings!==JSON.stringify(S.settings))S.ups.settings=now;
    if(SNAP.dayCap!==JSON.stringify(S.dayCap))S.ups.dayCap=now;
  }
  takeSnap();
}
takeSnap();
const save=()=>{stamp();lsSet(LS,S);scheduleSync();scheduleCloud()};

// ===== 日付 =====
const pad=n=>String(n).padStart(2,'0');
const ds=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>ds(new Date());
const pD=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addD=(s,n)=>{const d=pD(s);d.setDate(d.getDate()+n);return ds(d)};
const diffD=(a,b)=>Math.round((pD(b)-pD(a))/864e5);
const WD='日月火水木金土';
const fmtD=s=>{const d=pD(s);return `${d.getMonth()+1}/${d.getDate()}(${WD[d.getDay()]})`};
const isHoliday=s=>{const w=pD(s).getDay();return w===0||w===6};
const capOf=s=>S.dayCap[s]!=null?S.dayCap[s]:(isHoliday(s)?S.settings.holiday:S.settings.weekday);

// ===== 小物 =====
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const hash=s=>{let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return (h>>>0).toString(16)};
const PAL=['#5b6cff','#e0567a','#1f9d6b','#e08a00','#8e5bd6','#0f9bb5','#c9573a','#6f8f1f','#d04fb0','#4a7fb5'];
const colorOf=s=>PAL[parseInt(hash(s||''),16)%PAL.length];
const sdot=s=>`<span class="sd" style="background:${colorOf(s)}"></span>`;
const blocks=(r,n=10)=>'■'.repeat(Math.round(r*n))+'□'.repeat(n-Math.round(r*n));
const pct=(a,b)=>b?Math.round(a/b*100):0;
const stripLinks=s=>String(s||'').replace(/\[\[([^\]|]+)\|([^\]]+)\]\]/g,'$2').replace(/\[\[([^\]]+)\]\]/g,'$1').replace(/[*`]/g,'');
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),1800)}
const obLink=path=>IDX.vault?`obsidian://open?vault=${encodeURIComponent(IDX.vault)}&file=${encodeURIComponent(path.replace(/\.md$/,''))}`:null;

// ===== 範囲（単元）の組み立て =====
const GROUP_DIRS=['高校生の授業'];
function srcParts(p){let a=p.split('/');if(a[0]==='sources')a=a.slice(1);if(GROUP_DIRS.includes(a[0]))a=a.slice(1);return a}
function srcMatch(p,subj,per){const a=srcParts(p);if(a.length<3)return false;return (a[0]===subj||a[0].startsWith(subj))&&(a[1]===per||a[1].endsWith(per))}
function isDone(k){return !!(S.done[k]&&S.done[k].d)}
function setDone(k,v,date){const st=S.done[k]||{rv:[]};S.done[k]={d:v?(date||today()):null,rv:v?(st.rv||[]):[],up:Date.now()}}
function examUnits(test,ex){
  const st=S.settings,per=test.period,us=[];
  for(const n of IDX.notes){
    if(n.subject!==ex.subject)continue;
    const mine=n.sources.filter(p=>srcMatch(p,ex.subject,per));
    const old=n.period!==per;
    if(old&&!(st.includeOld&&mine.length))continue; // 前の時期のノートは設定がオンのときだけ
    // 授業の順：その時期の出典ファイル名にある日付（9_14ノート・9月10日…）の早い順
    const ord=Math.min(9999,...mine.map(p=>{const m=p.split('/').pop().match(/(\d{1,2})[_月\/.-](\d{1,2})/);return m?+m[1]*100+ +m[2]:9998}));
    us.push({key:'n:'+n.name,kind:'note',title:n.name,note:n,min:st.noteMin,old,ord});
  }
  us.sort((a,b)=>(a.old-b.old)||a.ord-b.ord||a.title.localeCompare(b.title,'ja'));
  for(const t of S.tasks.filter(t=>t.examId===ex.id))us.push({key:'t:'+t.id,kind:'task',title:t.title,min:t.min,task:t});
  const tp=`${ex.subject}_${per}_対策.md`;
  if(IDX.outputs.includes(tp))us.push({key:'p:'+ex.id,kind:'taisaku',title:'対策プリントで総チェック',min:40,path:'outputs/'+tp});
  return us;
}
function unprocessed(subj,per){const c=new Set(IDX.cited);return IDX.sources.filter(p=>srcMatch(p,subj,per)&&!c.has(p))}
function allExams(){const r=[];for(const t of S.tests)for(const ex of t.exams)if(ex.subject&&ex.date)r.push({test:t,ex});return r}

// ===== 計画づくり（逆算） =====
function buildPlan(){
  const t=today(),st=S.settings;
  const exams=allExams().filter(E=>E.ex.date>=t).map(E=>{
    const units=examUnits(E.test,E.ex);
    let dl=addD(E.ex.date,-1-st.reserve);if(dl<t)dl=t;
    return {...E,units,pending:units.filter(u=>!isDone(u.key)),deadline:dl,finalDay:st.reserve>0?addD(E.ex.date,-1):null,over:[]};
  });
  // 今日の復習
  const reviews=[],seen=new Set();
  for(const E of exams){if(E.ex.date<=t)continue;
    for(const u of E.units){if(u.kind!=='note'||seen.has(u.key))continue;const s=S.done[u.key];if(!s||!s.d)continue;
      const rv=s.rv||[];
      if(rv.includes(t)){seen.add(u.key);reviews.push({...u,kind:'review',key:'r:'+u.title,min:st.reviewMin,E,done:true});continue}
      if(rv.length>=st.review.length)continue;
      const base=rv.length?rv[rv.length-1]:s.d,due=addD(base,st.review[rv.length]);
      if(due<=t){seen.add(u.key);reviews.push({...u,kind:'review',key:'r:'+u.title,min:st.reviewMin,E,done:false,late:due<t})}
    }}
  let last=t;for(const E of exams){if(E.deadline>last)last=E.deadline;if(E.finalDay&&E.finalDay>last)last=E.finalDay}
  const score=(E,d)=>E.pending.reduce((a,u)=>a+u.min,0)/(diffD(d,E.deadline)+1);
  const days=[];
  for(let d=t;d<=last;d=addD(d,1)){
    const day={date:d,cap:capOf(d),items:[]};
    if(d===t){
      for(const E of exams)for(const u of E.units)if(S.done[u.key]&&S.done[u.key].d===t)day.items.push({...u,E,done:true});
      day.items.push(...reviews);
    }
    for(const E of exams)if(E.finalDay===d&&d>=t)day.items.push({kind:'final',key:'f:'+E.ex.id,title:'テスト前日の総復習',min:st.finalMin,E,done:isDone('f:'+E.ex.id)});
    day.free=day.cap-day.items.reduce((a,i)=>a+i.min,0);
    days.push(day);
  }
  // ① 後ろから詰める（できるだけ遅く）→ 各日に「最低これだけは必要」な量を求める
  exams.forEach(E=>{E.need={};E.left=[...E.pending]});
  for(let i=days.length-1;i>=0;i--){
    const d=days[i].date;let c=days[i].free;
    while(c>0){
      const el=exams.filter(E=>E.left.length&&E.deadline>=d);if(!el.length)break;
      el.sort((a,b)=>b.left.reduce((s,u)=>s+u.min,0)-a.left.reduce((s,u)=>s+u.min,0));
      const E=el[0],u=E.left.pop();E.need[d]=(E.need[d]||0)+1;c-=u.min;
    }
  }
  // ② 前から割り振る：必要な分を先に入れ、余った時間は教科のバランスで埋める
  exams.forEach(E=>{E.req=0;E.got=0});
  for(const day of days){
    const d=day.date;let free=day.free;
    const put=(E,over)=>{const u=E.pending.shift();E.got++;day.items.push({...u,E,done:false,over});free-=u.min};
    for(const E of exams){E.req+=E.need[d]||0;while(E.got<E.req&&E.pending.length>E.left.length)put(E,false)}
    for(;;){
      if(free<=0)break;
      const c=exams.filter(E=>E.pending.length>E.left.length&&E.deadline>=d);if(!c.length)break;
      c.sort((a,b)=>score(b,d)-score(a,d));put(c[0],false);
    }
    for(const E of exams)if(E.deadline===d)while(E.pending.length){E.over.push(E.pending[0]);put(E,true)}
    day.load=day.items.reduce((a,i)=>a+i.min,0);
  }
  return {days,exams,reviews};
}
function claudeActions(){
  const t=today(),out=[];
  for(const {test,ex} of allExams()){if(ex.date<t)continue;
    const un=unprocessed(ex.subject,test.period).length;
    if(un)out.push({cmd:`Ingest ${ex.subject} ${test.period}`,why:`未処理のプリント・ノートが ${un}件（ノート化すると範囲に入ります）`});
    const left=diffD(t,ex.date);
    if(left<=7&&IDX.vault&&!IDX.outputs.includes(`${ex.subject}_${test.period}_対策.md`))out.push({cmd:`対策 ${ex.subject} ${test.period}`,why:`テストまであと${left}日。対策プリントを作ると総チェック用に計画へ入ります`});
  }
  return out;
}

// ===== Obsidian（フォルダ連携） =====
const FS_OK='showDirectoryPicker' in window;
let vault=null,syncing=false,syncMsg='',syncT=null;
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('test-planner-db',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function idbGet(k){const db=await idb();return new Promise(r=>{const q=db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)})}
async function idbSet(k,v){const db=await idb();return new Promise(r=>{const tx=db.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=()=>r()})}
async function perm(ask){if(!vault)return false;const o={mode:'readwrite'};try{if(await vault.queryPermission(o)==='granted')return true;if(ask)return await vault.requestPermission(o)==='granted'}catch{}return false}
async function getDir(root,parts,create){let d=root;for(const p of parts)d=await d.getDirectoryHandle(p,{create:!!create});return d}
async function walk(dir,prefix,out){for await(const [name,h] of dir.entries()){if(name.startsWith('.'))continue;const p=prefix+'/'+name;if(h.kind==='directory')await walk(h,p,out);else out.push([p,h])}}
async function readText(dir,name){try{return await (await (await dir.getFileHandle(name)).getFile()).text()}catch{return null}}
async function writeText(dir,name,text){const h=await dir.getFileHandle(name,{create:true});const w=await h.createWritable();await w.write(text);await w.close()}

function parseFront(text){
  const fm={};if(!text.startsWith('---'))return fm;
  const end=text.indexOf('\n---',3);if(end<0)return fm;
  let last=null;
  for(const line of text.slice(3,end).split('\n')){
    const li=line.match(/^\s+-\s+(.+)$/);
    if(li&&last){if(!Array.isArray(fm[last]))fm[last]=[];fm[last].push(li[1].trim().replace(/^["']|["']$/g,''));continue}
    const kv=line.match(/^([^:\s][^:]*):\s*(.*)$/);
    if(kv){last=kv[1].trim();fm[last]=kv[2].trim().replace(/^["']|["']$/g,'')}
  }
  return fm;
}
function section(text,title){const re=new RegExp('^##\\s+'+title+'\\s*$','m');const m=re.exec(text);if(!m)return '';const rest=text.slice(m.index+m[0].length);const n=rest.search(/^##\s/m);return (n<0?rest:rest.slice(0,n)).trim()}
const blank=s=>!s||/^(なし|無し|-|ー)?$/.test(s.trim());
function parseNote(path,text){
  text=text.replace(/\r\n/g,'\n');const fm=parseFront(text);
  if(!fm['教科']||fm['種別']==='MOC'||/MOC$/.test(path.replace(/\.md$/,'')))return null;
  const name=path.split('/').pop().replace(/\.md$/,'');
  const src=Array.isArray(fm['出典'])?fm['出典']:(fm['出典']?[fm['出典']]:[]);

async function scanVault(){

const testFile=t=>(t.name||'テスト').replace(/[\\/:*?"<>|#^[\]]/g,'_')+'.md';

function applyCheck(key,checked,at){
  const t=today();
  if(key.startsWith('r:')){const s=S.done['n:'+key.slice(2)];if(!s||!s.d)return;s.rv=s.rv||[];
    if(checked&&!s.rv.includes(t)){s.rv.push(t);s.up=Date.now()}
    else if(!checked&&s.rv.includes(t)&&s.up<=at){s.rv=s.rv.filter(x=>x!==t);s.up=Date.now()}
    return}
  if(key.startsWith('t:')&&!S.tasks.some(x=>x.id===key.slice(2)))return;
  const s=S.done[key];if(!!(s&&s.d)===checked)return;
  if(s&&s.up>at)return; // アプリ側で後から変えた方を優先
  setDone(key,checked);
}
function importMd(text,at,test){
  let subj=null,inToday=!!test;
  for(const line of text.replace(/\r\n/g,'\n').split('\n')){
    const h=line.match(/^##\s+(.+)$/);
    if(h){if(test)subj=h[1].split(' — ')[0].trim();else inToday=h[1].includes('今日やること');continue}
    if(!inToday)continue;
    const cb=line.match(/^\s*[-*]\s+\[([ xX])\]\s+(.*)$/);if(!cb)continue;
    const checked=cb[1]!==' ',body=cb[2];
    const km=body.match(/%%\s*([a-z]:[^%]+?)\s*%%/),lm=body.match(/\[\[([^\]|#]+)/);
    if(km)applyCheck(km[1],checked,at);
    else if(lm)applyCheck((body.includes('🔁')?'r:':'n:')+lm[1].trim(),checked,at);
    else if(test&&subj){ // Obsidianで書き足したやること → タスクとして取り込む
      const ex=test.exams.find(e=>e.subject===subj);if(!ex)continue;
      const mm=body.match(/⏱\s*(\d+)/),title=body.replace(/⏱\s*\d+\s*分?/,'').trim();if(!title)continue;
      const task={id:uid(),examId:ex.id,title,min:mm?+mm[1]:30};S.tasks.push(task);if(checked)setDone('t:'+task.id,true);
    }
  }
}
function itemMd(i,withSubj){

    case 'note':return `${sj}[[${i.title}]]${mn}`;
    case 'review':return `🔁 復習｜${sj}[[${i.title}]]${mn}`;
    case 'task':return `📝 ${sj}${i.title}${mn} %%${i.key}%%`;
    case 'taisaku':return `📄 ${sj}[[${i.path.split('/').pop().replace(/\.md$/,'')}|対策プリント]]で総チェック${mn} %%${i.key}%%`;
    case 'final':return `🧠 ${sj}テスト前日の総復習${mn} %%${i.key}%%`;
  }
}

const LS_GH='test-planner-gh-v1',GH_FILE='planner.json';
let GH=lsGet(LS_GH,{repo:'yabatani715-byte/test-planner-data',token:''}),ghMsg='',ghErr='',ghBusy=false,ghT=null;
function canon(o){
  if(Array.isArray(o)){const a=o.map(canon);if(o.length&&o[0]&&o[0].id!=null)a.sort();return '['+a.join(',')+']'}
  if(o&&typeof o==='object')return '{'+Object.keys(o).sort().map(k=>JSON.stringify(k)+':'+canon(o[k])).join(',')+'}';
  return JSON.stringify(o);
}
function b64e(s){const b=new TextEncoder().encode(s);let r='';for(let i=0;i<b.length;i+=0x8000)r+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(r)}
const b64d=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g,'')),c=>c.charCodeAt(0)));
function mergeS(a,b){
  const del={...(a.deleted||{})};for(const [k,v] of Object.entries(b.deleted||{}))del[k]=Math.max(del[k]||0,v);
  const byId=(x=[],y=[])=>{const m=new Map();for(const o of [...x,...y]){const p=m.get(o.id);if(!p||(o.up||0)>(p.up||0))m.set(o.id,o)}return [...m.values()].filter(o=>!(del[o.id]>=(o.up||0)))};
  const done={...(a.done||{})};for(const [k,v] of Object.entries(b.done||{}))if(!done[k]||(v.up||0)>(done[k].up||0))done[k]=v;
  const logs=new Map();[...(a.logs||[]),...(b.logs||[])].forEach(l=>logs.set(l.id,l));
  const au=a.ups||{},bu=b.ups||{},pick=k=>(bu[k]||0)>(au[k]||0)?b:a;
  return {tests:byId(a.tests,b.tests),tasks:byId(a.tasks,b.tasks),done,logs:[...logs.values()],
    dayCap:pick('dayCap').dayCap||{},settings:Object.assign(defSettings(),pick('settings').settings||{}),
    ups:{settings:Math.max(au.settings||0,bu.settings||0),dayCap:Math.max(au.dayCap||0,bu.dayCap||0)},deleted:del};
}
async function ghApi(method,body){
  return fetch(`https://api.github.com/repos/${GH.repo}/contents/${GH_FILE}`+(method==='GET'?`?t=${Date.now()}`:''),
    {method,cache:'no-store',headers:{Authorization:'Bearer '+GH.token,Accept:'application/vnd.github+json'},body:body?JSON.stringify(body):undefined});
}
function scheduleCloud(){if(!GH.token)return;clearTimeout(ghT);ghT=setTimeout(()=>cloudSync(),2000)}
async function cloudSync(loud){
  if(!GH.token||!GH.repo||ghBusy)return;
  ghBusy=true;ghMsg='同期中…';renderSync();
  try{
    for(let n=0;n<3;n++){
      const r=await ghApi('GET');let remote=null,sha;
      if(r.status===200){const j=await r.json();sha=j.sha;remote=JSON.parse(b64d(j.content))}
      else if(r.status===401)throw new Error('トークンが正しくないか、期限切れです');
      else if(r.status===403)throw new Error('トークンにこのリポジトリへの権限がありません');
      else if(r.status!==404)throw new Error('GitHub '+r.status);
      if(remote){
        const before=canon(S);
        S=mergeS(S,remote.state||{});takeSnap();lsSet(LS,S);
        if(remote.idx&&(remote.idx.at||0)>(IDX.at||0)){IDX=remote.idx;lsSet(LS_IDX,IDX)}
        if(canon(S)!==before)scheduleSync();
      }
      const payload={v:1,state:S,idx:IDX};
      if(remote&&canon({v:1,state:remote.state,idx:remote.idx})===canon(payload))break;
      const p=await ghApi('PUT',{message:'sync',content:b64e(JSON.stringify(payload)),...(sha?{sha}:{})});
      if(p.ok)break;
      if(p.status===404)throw new Error('リポジトリが見つかりません（名前とトークンの権限を確認）');
      if(p.status===401)throw new Error('トークンが正しくないか、期限切れです');
      if(p.status===403)throw new Error('トークンに書き込み権限（Contents: Read and write）がありません');
      if(p.status!==409&&p.status!==422)throw new Error('保存に失敗 '+p.status);
    }
    const t=new Date();ghMsg=`同期 ${pad(t.getHours())}:${pad(t.getMinutes())}`;
    if(loud)toast('クラウド同期OK');
    ghErr='';
  }catch(e){ghMsg='エラー';ghErr=navigator.onLine?(e.message||String(e)):'オフラインです';if(loud)toast('クラウド同期: '+ghErr)}
  ghBusy=false;render();
}

    <div class="row" style="justify-content:center"><select data-act="tmsubj"><option value="">教科を選ぶ</option>${subs.map(s=>`<option ${TM.subj===s?'selected':''}>${esc(s)}</option>`).join('')}<option ${TM.subj==='その他'?'selected':''}>その他</option></select><span class="tag ${TM.mode==='work'?'':'w'}">${TM.mode==='work'?'集中':'休憩'}</span></div>
    <div class="clock" id="clock">${pad(Math.floor(l/60))}:${pad(l%60)}</div>
    <div class="row" style="justify-content:center"><button class="btn pri" data-act="tm">${TM.run?'一時停止':'スタート'}</button><button class="btn" data-act="tmreset">リセット</button>${TM.mode==='work'&&TM.left!=null&&!TM.run&&tmTotal()-l>=60?`<button class="btn" data-act="tmlog">${Math.floor((tmTotal()-l)/60)}分を記録</button>`:''}</div></div>`;
  return h;
}
function vPlan(P){
  if(!P.days.length)return `<div class="card empty">テストを登録すると、テスト日から逆算した毎日の予定がここに出ます。</div>`;
  let h=`<div class="card"><h2>🗓 テストまでの予定</h2><div class="muted" style="margin-bottom:6px">残っている範囲を、テストが近い教科・量が多い教科から優先して毎日に割り振っています。終わらなかった分は翌日以降に自動で組み直します。前日は総復習の日です。「使える時間」を押すと、その日だけ変更できます。</div>`;
  for(const d of P.days){
    const r=d.cap?Math.min(1,d.load/d.cap):1,ov=d.load>d.cap;
    h+=`<div class="day"><div class="dh"><b>${fmtD(d.date)}${d.date===today()?' 今日':''}</b><div class="bar"><i style="width:${r*100}%;${ov?'background:var(--warn)':''}"></i></div><button class="btn sm" data-act="cap" data-date="${d.date}">${d.load}/${d.cap}分${S.dayCap[d.date]!=null?' ✎':''}</button></div>
    <div class="dl">${d.items.map(i=>`<div>${i.done?'✔︎':'・'} ${i.E?sdot(i.E.ex.subject):''}${{note:'',review:'🔁 ',task:'📝 ',taisaku:'📄 ',final:'🧠 '}[i.kind]}${esc(i.title)} <span class="muted">${i.min}分</span>${i.over?' <span class="tag over">詰め込み</span>':''}</div>`).join('')||'<span class="muted">予定なし</span>'}</div></div>`;
  }
  return h+'</div>';
}
function vProg(P){
  const t=today();let h='';
  if(!S.tests.length)return `<div class="card empty">テストを登録すると、教科ごとの進度がここに出ます。</div>`;
  if(!IDX.notes.length)h+=`<div class="alert w">Obsidianのノートがまだ読み込まれていません。<a href="#" data-act="goto" data-tab="set">設定</a>から連携してください。</div>`;
  for(const test of [...S.tests].reverse()){
    const exs=test.exams.filter(e=>e.subject).sort((a,b)=>(a.date||'9').localeCompare(b.date||'9'));
    let all=0,dn=0;const rows=exs.map(ex=>{const us=examUnits(test,ex),d=us.filter(u=>isDone(u.key)).length;all+=us.length;dn+=d;return {ex,us,d}});
    h+=`<div class="card"><h2>${esc(test.name)} <span class="muted">${esc(test.period)}</span><span class="r">全体 ${pct(dn,all)}%（${dn}/${all}）</span></h2>`;
    for(const {ex,us,d} of rows){
      const E=P.exams.find(x=>x.ex.id===ex.id),left=ex.date?diffD(t,ex.date):null,un=unprocessed(ex.subject,test.period).length,op=OPEN.has(ex.id);
      const rem=us.filter(u=>!isDone(u.key)).reduce((a,u)=>a+u.min,0);
      let pace='';
      if(left!=null&&left<0)pace='<span class="muted">終了</span>';
      else if(E&&E.over.length)pace=`<span class="tag over">⚠ ${E.over.length}件あふれそう</span>`;
      else if(us.length&&d===us.length)pace='<span class="tag">✓ 完了</span>';
      else if(E)pace=`<span class="muted">残り${rem}分 · 1日あたり約${Math.ceil(rem/Math.max(1,diffD(t,E.deadline)+1))}分</span>`;
      h+=`<div class="subj"><div class="sh" data-act="open" data-id="${ex.id}"><span class="n">${sdot(ex.subject)}${esc(ex.subject)}</span><div class="bar"><i style="width:${pct(d,us.length)}%;background:${colorOf(ex.subject)}"></i></div><span class="p">${pct(d,us.length)}%（${d}/${us.length}）${ex.date?` · ${fmtD(ex.date)}${left>=0?` あと${left}日`:''}`:''} ${op?'▲':'▼'}</span></div>
      <div style="margin:4px 0 0 20px">${pace}${un?` <span class="tag w">未ノート化 ${un}件</span>`:''}</div>
      ${op?`<div style="margin-top:6px">${us.map(u=>itemHtml({...u,done:isDone(u.key)},{subj:false})).join('')||'<div class="muted">この教科・時期のノートがありません</div>'}</div>`:''}</div>`;
    }
    h+='</div>';
  }
  const since=addD(t,-6),by={};S.logs.filter(l=>l.date>=since).forEach(l=>by[l.subject]=(by[l.subject]||0)+l.min);
  const mx=Math.max(1,...Object.values(by));
  h+=`<div class="card"><h2>⏱ この7日の勉強時間<span class="r">${Object.values(by).reduce((a,b)=>a+b,0)}分</span></h2>${Object.keys(by).length?Object.entries(by).sort((a,b)=>b[1]-a[1]).map(([s,m])=>`<div class="hbar"><span>${sdot(s)}${esc(s)}</span><div class="bar"><i style="width:${m/mx*100}%;background:${colorOf(s)}"></i></div><span>${m}分</span></div>`).join(''):'<div class="muted">集中タイマーを使うと記録されます</div>'}</div>`;
  return h;
}
function periods(){const s=new Set(IDX.notes.map(n=>n.period).filter(Boolean));return [...s].sort()}
function subjectsFor(per){const s=new Set();IDX.notes.forEach(n=>{if(!per||n.period===per)s.add(n.subject)});return [...s].sort((a,b)=>a.localeCompare(b,'ja'))}
function vTests(){
  let h=`<datalist id="dlPer">${periods().map(p=>`<option value="${esc(p)}">`).join('')}</datalist><datalist id="dlSub">${subjectsFor().map(p=>`<option value="${esc(p)}">`).join('')}</datalist>`;
  h+=`<div class="row" style="margin-bottom:12px"><button class="btn pri" data-act="addtest">＋ テストを追加</button><span class="muted">「時期」はObsidianのノートの <code>時期:</code> と同じ名前にすると、その範囲のノートが自動で入ります</span></div>`;
  if(!S.tests.length)h+=`<div class="card empty">まだテストがありません</div>`;
  for(const test of [...S.tests].reverse()){
    h+=`<div class="card"><div class="row"><input style="flex:1;font-weight:600" value="${esc(test.name)}" data-act="tname" data-id="${test.id}" placeholder="テスト名"><label>時期</label><input list="dlPer" style="width:130px" value="${esc(test.period)}" data-act="tper" data-id="${test.id}"><button class="btn sm" data-act="deltest" data-id="${test.id}">削除</button></div>
    <div class="muted" style="margin-top:8px">教科と日付</div>`;
    for(const ex of test.exams){
      const n=IDX.notes.length?examUnits(test,ex).filter(u=>u.kind==='note').length:null;
      h+=`<div class="exrow"><input list="dlSub" value="${esc(ex.subject)}" placeholder="教科" data-act="exsub" data-t="${test.id}" data-id="${ex.id}"><input type="date" value="${esc(ex.date)}" data-act="exdate" data-t="${test.id}" data-id="${ex.id}"><button class="btn sm" data-act="delex" data-t="${test.id}" data-id="${ex.id}">×</button></div>
      <div class="tasks">${n!=null&&ex.subject?`<span class="muted">範囲のノート ${n}件</span>`:''}
        ${S.tasks.filter(x=>x.examId===ex.id).map(x=>`<div>📝 ${esc(x.title)} <span class="muted">${x.min}分</span> <a href="#" data-act="deltask" data-id="${x.id}">削除</a></div>`).join('')}
        ${ex.subject?`<div class="row"><input placeholder="やることを追加（例：ワーク p.30-45）" style="flex:1" data-tin="${ex.id}"><input type="number" value="30" min="5" step="5" data-tmin="${ex.id}" style="width:64px">分<button class="btn sm" data-act="addtask" data-id="${ex.id}">追加</button></div>`:''}</div>`;
    }
    h+=`<div class="row"><button class="btn sm" data-act="addex" data-id="${test.id}">＋ 教科を追加</button>${test.period&&subjectsFor(test.period).length?`<button class="btn sm" data-act="addall" data-id="${test.id}">「${esc(test.period)}」のノートがある教科をまとめて追加</button>`:''}</div></div>`;
  }
  return h;
}
function vSet(){
  const st=S.settings;
  const num=(k,l,u='分')=>`<div class="row"><label style="min-width:150px">${l}</label><input type="number" min="0" step="5" value="${st[k]}" data-act="setn" data-k="${k}">${u}</div>`;
  return `<div class="card"><h2>☁️ スマホ⇔PC 同期<span class="r">${GH.token?(ghMsg==='エラー'?'⚠ エラー':'✅ 同期中'):'未設定'}</span></h2>
  <p class="muted" style="margin-top:0">GitHub の非公開リポジトリにデータを置いて、iPhone と PC を自動で同期します。テスト・進度・やること・勉強時間・ノート一覧がすべて同期されます。<b>PCとiPhoneのそれぞれで</b>下の2つを入れてください。</p>
  ${ghErr?`<div class="alert w">${esc(ghErr)}</div>`:''}
  <div class="row"><label style="min-width:90px">リポジトリ</label><input id="ghRepo" value="${esc(GH.repo)}" style="flex:1"></div>
  <div class="row"><label style="min-width:90px">トークン</label><input id="ghToken" type="password" autocomplete="off" placeholder="github_pat_…" value="${esc(GH.token)}" style="flex:1"></div>
  <div class="row"><button class="btn pri" data-act="ghsave">保存して同期</button>${GH.token?'<button class="btn" data-act="ghoff">この端末の同期を解除</button>':''}</div>
  <details><summary>トークンの作り方（最初の1回だけ）</summary><ol class="muted" style="padding-left:20px">
    <li><a class="ob" href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">GitHub のトークン作成ページ</a>を開く</li>
    <li>Token name に「テスト勉強プランナー」、Expiration は好きな期限（最長1年）</li>
    <li>Repository access →「Only select repositories」→ <b>test-planner-data</b> を選ぶ</li>
    <li>Permissions →「Contents」を <b>Read and write</b> にする</li>
    <li>「Generate token」を押し、出てきた <code>github_pat_…</code> をコピーして上に貼る（iPhoneにはAirDropやメモで送ると楽）</li>
  </ol><div class="muted">このリポジトリだけを読み書きできる鍵なので、ほかのリポジトリには触れません。トークンはこの端末の中にだけ保存されます。</div></details></div>
  <div class="card"><h2>🔗 Obsidian 連携</h2>
  ${FS_OK?`<p class="muted" style="margin-top:0">iCloud Drive の <b>second brain</b> フォルダを選んでください。<code>wiki/</code> のノート（教科・時期）を読み取り、進度表と今日のTODOを <code>outputs/勉強計画/</code> に書き出します。<code>sources/</code> と <code>wiki/</code> には書き込みません。</p>
  <div class="row"><button class="btn pri" data-act="connect">${vault?'別のフォルダに変更':'フォルダを選んで連携'}</button>${vault?`<button class="btn" data-act="sync">今すぐ同期</button>`:''}</div>
  ${IDX.notes.length?`<div class="muted">読み込み済み：ノート ${IDX.notes.length}件 / ソース ${IDX.sources.length}件（${new Date(IDX.at).toLocaleString('ja-JP')}）</div>`:''}`
  :`<p class="muted" style="margin-top:0">この端末ではObsidianのフォルダを直接読めません。上の「スマホ⇔PC 同期」を設定すると、PCが読み込んだノート一覧とObsidianでのチェックがこの端末にも届きます${IDX.at?`（ノート ${IDX.notes.length}件を受信済み）`:''}。</p>`}</div>
  <div class="card"><h2>⏰ 勉強時間</h2>${num('weekday','平日に使える時間')}${num('holiday','土日に使える時間')}${num('noteMin','ノート1つの目安')}${num('reviewMin','復習1回')}${num('finalMin','前日の総復習')}
  <div class="row"><label style="min-width:150px">前の時期のノート</label><label style="color:var(--text)"><input type="checkbox" data-act="setb" data-k="includeOld" ${st.includeOld?'checked':''}> 今回のプリントに出てくる前の時期（一学期など）のノートも範囲に入れる</label></div>
  <div class="row"><label style="min-width:150px">総復習にあてる日数</label><input type="number" min="0" max="3" value="${st.reserve}" data-act="setn" data-k="reserve">日（テストの前日から）</div>
  <div class="row"><label style="min-width:150px">復習のタイミング</label><input value="${st.review.join(',')}" data-act="setrv" style="width:100px">日後（覚えた日から。忘却曲線）</div>
  <div class="row"><label style="min-width:150px">タイマー</label><input type="number" min="5" value="${st.pomo}" data-act="setn" data-k="pomo">分集中 /<input type="number" min="1" value="${st.brk}" data-act="setn" data-k="brk">分休憩</div></div>
  <div class="card"><h2>💾 データ</h2><div class="row"><button class="btn" data-act="export">書き出し(JSON)</button><label class="btn">読み込み<input type="file" accept=".json" data-act="import" hidden></label><button class="btn" data-act="reset">全部消す</button></div></div>`;
}
function render(){
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('act',b.dataset.tab===TAB));
  renderSync();
  const P=buildPlan();
  $('#main').innerHTML=TAB==='today'?vTodayTab(P):TAB==='plan'?vPlan(P):TAB==='prog'?vProg(P):TAB==='tests'?vTests():vSet();
}

// ===== 操作 =====
const findTest=id=>S.tests.find(t=>t.id===id);
const findEx=(tid,id)=>findTest(tid).exams.find(e=>e.id===id);
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-tab],[data-act]');if(!b)return;
  if(b.closest('#nav')){TAB=b.dataset.tab;lsSet(LS_TAB,TAB);render();return}
  const a=b.dataset.act,id=b.dataset.id;
  if(['chk','tmsubj','tname','tper','exsub','exdate','setn','setb','setrv','import'].includes(a))return;
  e.preventDefault();
  switch(a){
    case 'goto':TAB=b.dataset.tab;lsSet(LS_TAB,TAB);render();break;
    case 'sync':await cloudSync(true);await syncNow(true);break;
    case 'connect':connectVault();break;
    case 'copy':try{await navigator.clipboard.writeText(b.dataset.text);toast('コピーしました。Claudeに貼り付けてね')}catch{prompt('コピーしてください',b.dataset.text)}break;
    case 'open':OPEN.has(id)?OPEN.delete(id):OPEN.add(id);render();break;
    case 'cap':{const d=b.dataset.date,v=prompt(`${fmtD(d)} に使える時間（分）\n空欄でいつもの設定に戻します`,capOf(d));if(v===null)return;if(v.trim()==='')delete S.dayCap[d];else if(!isNaN(+v))S.dayCap[d]=Math.max(0,+v);save();render();break}
    case 'addtest':{const per=periods().includes('二学期中間')?'二学期中間':'';S.tests.push({id:uid(),name:per?per+'テスト':'新しいテスト',period:per,exams:[],up:Date.now()});save();render();break}
    case 'deltest':if(confirm('このテストを削除しますか？'))S.tests=S.tests.filter(t=>t.id!==id),save(),render();break;
    case 'addex':findTest(id).exams.push({id:uid(),subject:'',date:''});save();render();break;
    case 'addall':{const t=findTest(id);for(const s of subjectsFor(t.period))if(!t.exams.some(e=>e.subject===s))t.exams.push({id:uid(),subject:s,date:''});save();render();toast('日付を入れてください');break}
    case 'delex':{const t=findTest(b.dataset.t);t.exams=t.exams.filter(x=>x.id!==id);save();render();break}
    case 'addtask':{const i=$(`[data-tin="${id}"]`),m=$(`[data-tmin="${id}"]`);if(!i.value.trim())return;S.tasks.push({id:uid(),examId:id,title:i.value.trim(),min:Math.max(5,+m.value||30)});save();render();break}
    case 'deltask':S.tasks=S.tasks.filter(x=>x.id!==id);save();render();break;
    case 'tm':if(TM.run){TM.left=tmLeft();TM.run=false}else{if(TM.mode==='work'&&!TM.subj)toast('教科を選ぶと記録が教科別になります');TM.end=Date.now()+tmLeft()*1000;TM.run=true}render();break;
    case 'tmreset':TM.run=false;TM.left=null;TM.mode='work';document.title='テスト勉強プランナー';render();break;
    case 'tmlog':{const m=Math.floor((tmTotal()-tmLeft())/60);logStudy(m);TM.left=null;toast(`${m}分記録しました`);render();break}
    case 'export':{const u=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));const x=document.createElement('a');x.href=u;x.download=`テスト勉強プランナー_${today()}.json`;x.click();break}
    case 'reset':if(confirm('テスト・進度をすべて消します（同期中の端末からも消えます）。よろしいですか？')){S.tests=[];S.tasks=[];S.dayCap={};S.settings=defSettings();Object.keys(S.done).forEach(k=>setDone(k,false));save();render()}break;
    case 'ghsave':{GH={repo:$('#ghRepo').value.trim(),token:$('#ghToken').value.trim()};lsSet(LS_GH,GH);ghMsg='';await cloudSync(true);break}
    case 'ghoff':if(confirm('この端末のクラウド同期を解除しますか？（データは消えません）')){GH={repo:GH.repo,token:''};lsSet(LS_GH,GH);ghMsg='';render()}break;
  }
});
document.addEventListener('change',async e=>{
  const b=e.target,a=b.dataset.act;if(!a)return;
  switch(a){
    case 'chk':{const k=b.dataset.key;
      if(k.startsWith('r:')){const s=S.done['n:'+k.slice(2)],t=today();if(s){s.rv=s.rv||[];if(b.checked){if(!s.rv.includes(t))s.rv.push(t)}else s.rv=s.rv.filter(x=>x!==t);s.up=Date.now()}}
      else setDone(k,b.checked);
      save();if(b.checked)toast('よくできました！');render();break}
    case 'tmsubj':TM.subj=b.value;break;
    case 'tname':findTest(b.dataset.id).name=b.value.trim()||'テスト';save();break;
    case 'tper':findTest(b.dataset.id).period=b.value.trim();save();render();break;
    case 'exsub':findEx(b.dataset.t,b.dataset.id).subject=b.value.trim();save();render();break;
    case 'exdate':findEx(b.dataset.t,b.dataset.id).date=b.value;save();render();break;
    case 'setn':S.settings[b.dataset.k]=Math.max(0,+b.value||0);save();break;
    case 'setb':S.settings[b.dataset.k]=b.checked;save();render();break;
    case 'setrv':{const v=b.value.split(/[,、\s]+/).map(Number).filter(n=>n>0);if(v.length)S.settings.review=v;save();break}
    case 'import':{const f=b.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!Array.isArray(d.tests))throw 0;(d.logs||[]).forEach(l=>l.id||(l.id=uid()));S=mergeS(S,d);save();render();toast('読み込みました')}catch{toast('このファイルは読み込めません')}break}
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset.tin){$(`[data-act="addtask"][data-id="${e.target.dataset.tin}"]`).click()}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){render();cloudSync().then(()=>syncNow(false))}});
setInterval(()=>{if(!document.hidden&&!TM.run)cloudSync().then(()=>syncNow(false))},60000);

(async()=>{
  render();
  if(FS_OK){try{vault=await idbGet('vault')||null}catch{}}
  await cloudSync();
  if(vault)syncNow(false);else renderSync();
})();
</script>
</body>
